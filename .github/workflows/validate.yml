name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      GODOT_TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "${GODOT_TEMPLATES_DIR}"
          cp -R /tmp/templates/templates/. "${GODOT_TEMPLATES_DIR}/"
          godot --version | grep -F "${GODOT_VERSION}.stable"

      - name: Import and validate project resources
        run: godot --headless --path . --editor --quit

      - name: Run native M0-M6 suite
        run: godot --headless --path . --script res://tests/runner.gd

      - name: Run MIDI importer tests directly
        run: python -m unittest discover -s tools/chart_import/tests -v

      - name: Validate release content and charts
        run: godot --headless --path . --script res://scripts/validate_release_content.gd

      - name: Prepare Web export directory
        if: always()
        run: mkdir -p build/web

      - name: Export Web release
        id: web-export
        if: always()
        run: godot --headless --path . --export-release Web build/web/index.html

      - name: Verify Web launch artifacts
        if: always() && steps.web-export.outcome == 'success'
        run: python scripts/verify_web_export.py build/web

      - name: Upload Web release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baile-dos-crias-web
          path: build/web/
          if-no-files-found: error
